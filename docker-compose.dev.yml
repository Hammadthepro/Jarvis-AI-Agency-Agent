# Local development database. Started and health-checked by scripts/dev-up.sh (also on Codespace start).
# The API, worker and dashboard run as local processes managed by scripts/dev-up.sh / dev-down.sh.
#
# Credentials are the ones existing volumes were initialised with (POSTGRES_* only applies to an EMPTY volume).
# They must match DATABASE_URL in .env: postgresql://postgres:jarvis@localhost:5432/jarvis
# The named volume keeps data across restarts and rebuilds; nothing here ever deletes it.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    ports: [ "127.0.0.1:5432:5432" ]
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jarvis -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
volumes: { pgdata: {} }
