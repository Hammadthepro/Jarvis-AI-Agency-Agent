# Local development: Postgres 16 + API + worker (QA runs as a local subprocess unless QA_RUNNER_MODE=docker).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: jarvis, POSTGRES_DB: jarvis }
    ports: [ "5432:5432" ]
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
volumes: { pgdata: {} }
