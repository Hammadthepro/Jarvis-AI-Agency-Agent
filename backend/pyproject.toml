[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS: autonomous AI employee for a website development agency"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "asyncpg>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "anthropic>=0.40",
  "structlog>=24.4",
  "jinja2>=3.1",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
# S608: SQL fragments are built only from internal constants (never user input).
# S603/S607: subprocess calls use fixed argument lists (docker/node/npx), never a shell.
# ASYNC230/240: small local file reads in async code are acceptable here.
ignore = ["S101", "S311", "B008", "E501", "S608", "S603", "S607", "ASYNC230", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
