name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_ADMIN_DSN: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install postgres client (pg_dump for T14)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: QA runner deps + Chromium
        working-directory: qa-runner
        run: npm ci && npx playwright install --with-deps chromium
      - name: Backend deps
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check jarvis tests
      - name: Tests (real Postgres + real Chromium; provider HTTP via test doubles)
        working-directory: backend
        run: pytest -q

  dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: dashboard
        run: npm ci && npm run typecheck && npm test && npx vite build

  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  # Live provider tests: manual, protected environment, tightly capped. Never runs on push.
  live-integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: live-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: backend
        run: pip install -e ".[dev]" && JARVIS_LIVE_TESTS=1 pytest -q tests/live -rs
        env:
          TEST_PG_ADMIN_DSN: ${{ secrets.LIVE_TEST_PG_ADMIN_DSN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
