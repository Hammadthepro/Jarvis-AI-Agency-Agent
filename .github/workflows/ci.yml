name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_ADMIN_DSN: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install postgres client (pg_dump for T14)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: QA runner deps + Chromium
        working-directory: qa-runner
        run: npm ci && npx playwright install --with-deps chromium
      - name: Backend deps
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check jarvis tests
      - name: Tests (real Postgres + real Chromium; provider HTTP via test doubles)
        working-directory: backend
        run: pytest -q

  dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: dashboard
        run: npm ci && npm run typecheck && npm test && npx vite build

  voice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: apps/voice
        run: pip install -r requirements.txt pytest pytest-asyncio && pytest -q -rs tests

  images:
    # Controlled build: the ONLY place images (incl. the QA sandbox) are built with registry access.
    # The sandbox image ID is recorded so production can pin SANDBOX_IMAGE=sha256:<id>; runtime never pulls.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build QA sandbox image (pinned base digest)
        run: docker build -f docker/qa-sandbox.Dockerfile -t jarvis-qa-sandbox:ci .
      - name: Record sandbox image digest
        run: docker image inspect --format '{{.Id}}' jarvis-qa-sandbox:ci | tee sandbox-image-id.txt
      - name: Verify sandbox runs with no network and no pull
        run: |
          docker run --rm --pull=never --network none --read-only --user 10001:10001 --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp jarvis-qa-sandbox:ci node -e "fetch('https://example.com').then(()=>process.exit(1)).catch(()=>process.exit(0))"
      - name: Build app image
        run: docker build -f docker/app.Dockerfile -t jarvis-app:ci .
      - uses: actions/upload-artifact@v4
        with: { name: sandbox-image-id, path: sandbox-image-id.txt }

  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  # Live provider tests: manual, protected environment, tightly capped. Never runs on push.
  live-integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: live-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: backend
        run: pip install -e ".[dev]" && JARVIS_LIVE_TESTS=1 pytest -q tests/live -rs
        env:
          TEST_PG_ADMIN_DSN: ${{ secrets.LIVE_TEST_PG_ADMIN_DSN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
